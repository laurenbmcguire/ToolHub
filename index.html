<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crush C214</title>
<meta name="description" content="Pass WGU C214 Financial Management in 7 days: taught lessons, real videos, 360+ exam-style questions, unlimited TVM and capital budgeting drills, finance labs, a financial calculator and games.">
<meta name="theme-color" content="#0C6B58">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crush C214">
<meta property="og:title" content="Crush C214 — pass Financial Management in 7 days">
<meta property="og:description" content="Lessons, videos, 360+ practice questions, unlimited TVM drills, finance labs and games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: study cockpit — sticky header (streak · XP · readiness) + scrollable tab rail, single 920px column. Signature: gold highlighter marks and a compound-growth curve that fills as you become exam-ready. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#14201B; --muted:#55645C; --line:#D6DFD9;
  --accent:#0C6B58; --accent-ink:#FFFFFF; --soft:#E2EFE9; --hi:#F6C744; --hi-ink:#14201B;
  --good:#18805A; --good-soft:#DDF3E9; --bad:#BE3B34; --bad-soft:#FBE4E2; --warn:#B26A00; --warn-soft:#FFF0D6;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1411; --surface:#13201B; --ink:#E5EEE9; --muted:#98A89F; --line:#26382F;
  --accent:#4FD1AE; --accent-ink:#0B1411; --soft:#1A2E27; --hi:#E8B93A; --hi-ink:#0B1411;
  --good:#4CC28A; --good-soft:#123227; --bad:#F27269; --bad-soft:#3A1A1C; --warn:#F2B44C; --warn-soft:#3A2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#13201B; --ink:#E5EEE9; --muted:#98A89F; --line:#26382F;
  --accent:#4FD1AE; --accent-ink:#0B1411; --soft:#1A2E27; --hi:#E8B93A; --hi-ink:#0B1411;
  --good:#4CC28A; --good-soft:#123227; --bad:#F27269; --bad-soft:#3A1A1C; --warn:#F2B44C; --warn-soft:#3A2C12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font:800 1.15rem/1.2 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand b span{background:linear-gradient(transparent 55%,var(--hi) 55% 92%,transparent 92%)}
.hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:700 .92rem var(--f-body);padding:10px 11px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.75rem,5vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font:700 .74rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mark{background:linear-gradient(transparent 58%,var(--hi) 58% 94%,transparent 94%);padding:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 .92rem var(--f-body);padding:10px 14px;border-radius:10px;cursor:pointer;text-decoration:none;min-height:42px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.84rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;max-width:100%}
input[type=range]{padding:0;min-height:auto;accent-color:var(--accent);width:100%}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.88rem}
label{font-weight:700;font-size:.88rem}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 .75rem var(--f-body);padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.hi{background:var(--hi);color:var(--hi-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
hr{border:0;border-top:1px solid var(--line);margin:0}
a{color:var(--accent)}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:center}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.hero svg{width:100%;height:auto;display:block}
.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div b{display:block;font:800 1.5rem var(--f-display)}
.stat div span{font-size:.8rem;color:var(--muted)}
.ring{width:84px;height:84px;flex:0 0 auto}
/* heat map */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.heat button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.heat button b{font:700 .9rem/1.25 var(--f-display)}
.heat .m0{border-left:6px solid var(--line)} .heat .m1{border-left:6px solid var(--bad)} .heat .m2{border-left:6px solid var(--warn)} .heat .m3{border-left:6px solid var(--good)}
/* plan */
.day{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dn{font:800 1.8rem/1 var(--f-display);color:var(--muted)}
.day.today .dn span{background:var(--hi);color:var(--hi-ink);padding:0 5px;border-radius:5px}
.day>div{min-width:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:3px 0;font-weight:400}
.task input{min-height:auto;width:18px;height:18px;margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.week span{font-size:.7rem;color:var(--muted)}
/* lesson */
.lesson .body{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.lesson .body ul,.lesson .body ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
code{font-family:var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.9em}
.example{border-left:4px solid var(--hi);padding:4px 0 4px 14px}
.example ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.callout{border-radius:12px;padding:14px 16px;background:var(--hi);color:var(--hi-ink)}
.traps li{margin-bottom:6px}
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;max-width:100%}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.yt .play i{width:64px;height:64px;border-radius:50%;background:var(--hi);color:var(--hi-ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.5rem}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.vids>div{min-width:0;display:flex;flex-direction:column;gap:6px}
/* flashcards */
.fc-scene{perspective:1200px}
.fc{position:relative;width:100%;min-height:270px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;overflow:auto}
.fc .face.back{transform:rotateY(180deg);background:var(--soft)}
.fc .face p{font-size:1.12rem;max-width:52ch}
.fc .face.front p{font:700 1.4rem/1.3 var(--f-display)}
/* quiz */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:13px 15px;border-radius:12px;font:inherit;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt b{font-family:var(--f-mono);margin-right:8px}
.explain{border-radius:12px;padding:14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.qnav button{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 .78rem var(--f-mono);cursor:pointer;padding:0}
.qnav button.ans{background:var(--soft)}
.qnav button.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.qnav button.cur{outline:2px solid var(--accent)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
/* games */
.mm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 .78rem/1.25 var(--f-body);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;cursor:pointer;overflow:hidden;word-break:break-word}
.tile.up{background:var(--surface);color:var(--ink)}
.tile.done{background:var(--good-soft);color:var(--good);border-color:var(--good);cursor:default}
.tile.term.up{font-family:var(--f-display);font-size:.9rem}
@media (max-width:420px){.tile{font-size:.64rem;padding:4px}.tile.term.up{font-size:.72rem}}
.bucket{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
/* labs */
.lab canvas{display:block;width:100%;border-radius:12px;background:var(--surface);border:1px solid var(--line);touch-action:manipulation}
.ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.ctl>*{min-width:0}
.out{font-family:var(--f-mono);font-size:.9rem;display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.out dt{color:var(--muted)} .out dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
/* formula */
.formula{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.formula>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.formula b{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.formula .f{font-family:var(--f-mono);font-size:.93rem;overflow-x:auto}
/* player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.player .stage{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:820px;margin:0 auto;width:100%;gap:18px;overflow:auto}
.player .slide{font:700 clamp(1.25rem,4.2vw,2.1rem)/1.3 var(--f-display);animation:rise .5s ease}
.player .pc{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:10px}
@keyframes rise{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;animation:rise .3s ease;max-width:calc(100% - 32px);text-align:center}
.search-hit{padding:10px 0;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header.top,.noprint,.btn{display:none!important}
  body{background:#fff;color:#000;font-size:11px}
  .wrap{padding:0;max-width:none}
  .card,.formula>div{border:1px solid #bbb;break-inside:avoid}
  .formula{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b><span>Crush</span> C214</b><div class="hud" id="hud"></div></div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="app"><p class="muted">Loading your study plan…</p></main>
<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
